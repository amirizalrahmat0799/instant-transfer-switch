name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  switch:
    name: Switch (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: switch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and integration tests (Testcontainers starts PostgreSQL)
        run: mvn -B verify

  bank:
    name: Bank simulator (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bank
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: bank/go.mod
      - run: go vet ./...
      - run: go test -race ./...

  e2e:
    name: End-to-end demo
    needs: [switch, bank]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start the switch, database and three banks
        run: docker compose up -d --build --wait
      - name: Run scripts/demo.sh
        run: bash scripts/demo.sh
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
